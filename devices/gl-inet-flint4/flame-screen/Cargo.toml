[package]
name        = "flame-screen"
version     = "0.1.0"
edition     = "2021"
license     = "MIT"
description = "Blue-flame internet status on the GL.iNet Flint 4's built-in LCD"

[dependencies]
# The same effect the T-Display firmware and the PC previewer run.
flame                  = { path = "../../../firmware/flame" }
embedded-graphics-core = "0.4.0"
serde                  = { version = "1", features = ["derive"] }
serde_json             = "1"

[profile.release]
codegen-units = 1
lto           = true
opt-level     = 3
panic         = "abort"
strip         = true
