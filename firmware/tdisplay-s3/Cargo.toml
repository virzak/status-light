[package]
name         = "status-tdisplay-s3"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.88"
license      = "MIT"
description  = "Internet-status display firmware for the LilyGO T-Display-S3 (esp-hal, blue flame when online)"

[dependencies]
# Board support and the i8080 LCD driver (both published from zompinc/esp-lcd-i8080).
lilygo-t-display-s3 = "0.1.0"
flame = { path = "../flame" }

esp-hal      = { version = "~1.2.2", features = ["esp32s3", "unstable"] }
esp-rtos     = { version = "0.4.0", features = ["embassy", "esp-alloc", "esp32s3", "log-04"] }
esp-alloc    = { version = "0.11.0", features = ["esp32s3"] }
esp-backtrace = { version = "0.20.0", features = ["esp32s3", "panic-handler", "println"] }
esp-println  = { version = "0.18.0", features = ["esp32s3", "log-04"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3", "log-04"] }

embassy-executor = "0.10.0"
embassy-time     = "0.5.0"
embassy-futures  = "0.1.1"

embedded-graphics = "0.8.2"
embedded-io-async = "0.6"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = "fat"
opt-level     = "s"
